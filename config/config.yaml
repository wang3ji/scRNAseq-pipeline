# scRNA-seq pipeline settings. Paths are relative to the repo root.
samplesheet: config/samples.csv
outdir: results
seed: 0

qc:
  min_genes_per_cell: 200
  min_cells_per_gene: 3
  mad_cutoff: 5            # outlier cutoff on log counts, log genes, % counts in top 20 genes
  mito_mad_cutoff: 3
  max_pct_mito: 20         # hard ceiling on % mitochondrial reads

doublets:
  run: true                # Scrublet, run per sample

normalize:
  target_sum: 10000
  n_top_genes: 2000        # highly variable genes (seurat_v3 flavor, on raw counts)

dimred:
  n_pcs: 30
  integrate: harmony       # harmony or none; ignored with one sample
  n_neighbors: 15

cluster:
  resolution: 0.8

annotation:
  # Marker genes per cell type. Each cluster gets the type with the highest mean score.
  # Keep lists distinct: a gene shared by two types (e.g. NKG7 in NK and CD8 T) blurs them.
  markers:
    CD4 T: [CD3E, CD4, IL7R, MAL, CD40LG]
    CD8 T: [CD3E, CD8A, CD8B]
    MAIT: [SLC4A10, TRAV1-2, KLRB1]
    NK: [KLRF1, NCAM1, SH2D1B, GNLY]
    B: [MS4A1, CD79A, CD79B, CD19]
    Plasma: [JCHAIN, MZB1, IGHG1]
    CD14 Mono: [CD14, LYZ, S100A8, S100A9]
    FCGR3A Mono: [FCGR3A, MS4A7, LST1]
    cDC: [FCER1A, CD1C, CLEC10A]
    pDC: [LILRA4, IL3RA, CLEC4C]
    Platelet: [PPBP, PF4]
    Progenitor: [CD34, SOX4]

pseudobulk_de:
  # Compares conditions within each cell type with DESeq2 on summed counts per sample.
  # Needs at least 2 samples per condition, so it is skipped for the PBMC demo.
  run: auto                # auto runs only when there are enough replicates
  reference: control
  min_cells: 10            # min cells for a sample to count toward a cell type
